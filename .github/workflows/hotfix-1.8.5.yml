name: Fix and build Hermes 1.8.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix-1.8.5.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply floating ball initialization repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopFloatingHost.kt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('package com.qingyu.hermescompanion.desktop\n\nimport androidx.compose.ui.awt.ComposeWindow\nimport com.qingyu.hermescompanion.model.HermesSession\nimport com.qingyu.hermescompanion.model.VoicePhase\nimport com.qingyu.hermescompanion.platform.DesktopHost\nimport kotlinx.coroutines.*\nimport java.awt.*\nimport java.awt.dnd.*\nimport java.awt.event.*\nimport java.awt.image.BufferedImage\nimport javax.imageio.ImageIO\nimport javax.swing.*\nimport kotlin.math.*\n\ninternal fun desktopWorkAreas():List<Rectangle> = GraphicsEnvironment.getLocalGraphicsEnvironment().screenDevices.map {d->\n    val c=d.defaultConfiguration;val b=Rectangle(c.bounds);val i=Toolkit.getDefaultToolkit().getScreenInsets(c)\n    Rectangle(b.x+i.left,b.y+i.top,(b.width-i.left-i.right).coerceAtLeast(1),(b.height-i.top-i.bottom).coerceAtLeast(1))\n}\n\ninternal fun isFloatingContextClick(event:MouseEvent,mac:Boolean=DesktopHost.isMac):Boolean =\n    event.isPopupTrigger||SwingUtilities.isRightMouseButton(event)||(mac&&event.isControlDown&&SwingUtilities.isLeftMouseButton(event))\n\n/** Native unowned windows survive hiding the main frame; all callbacks run on the AWT event thread. */\ninternal class DesktopFloatingHost(private val c:DesktopController):AutoCloseable {\n    private val icon:BufferedImage=ImageIO.read(javaClass.getResource("/icon.png"))\n    private val ball=JWindow().apply {background=Color(0,0,0,0);isAlwaysOnTop=true;focusableWindowState=false;setSize(84,84)}\n    private val bubble=BallPanel()\n    private var quick:ComposeWindow?=null\n    private var selection:ScreenSelection?=null\n    private var captureJob:Job?=null\n    private var capturing=false\n    private var disposed=false\n    private fun contextActions()=listOf(\n            DesktopMenuAction("ask","提问","history"){c.companion.open();sync()},\n            DesktopMenuAction("capture","框选截图","capture"){c.companion.open(CompanionAction.CAPTURE);sync()},\n            DesktopMenuAction("voice","连续语音","mic"){c.companion.open(CompanionAction.VOICE);sync()},\n            DesktopMenuAction("open","打开主窗口","panel",dividerBefore=true){c.companion.showMain?.invoke()},\n            DesktopMenuAction("hide-floating","关闭悬浮球","eye-off"){c.floatingAssistantEnabled=false;c.savePreference("floatingAssistantEnabled","false");sync()},\n        )\n    private val contextMenu=if(DesktopHost.isMac)null else DesktopMenuHost(c,"悬浮助手",::contextActions)\n    private val macContextMenu=if(DesktopHost.isMac)MacFloatingMenu(::contextActions)else null\n    private fun dismissContextMenu(){contextMenu?.dismiss();macContextMenu?.dismiss()}\n    init {\n        ball.contentPane=bubble\n        val area=desktopWorkAreas().last()\n        val initial=Point(c.store.get("floatingX",(area.x+area.width-110).toString()).toIntOrNull()?:area.x+area.width-110,c.store.get("floatingY",(area.y+area.height/2).toString()).toIntOrNull()?:area.y+area.height/2)\n        ball.location=clampFloatingBounds(initial,84,84,desktopWorkAreas())\n        c.companion.capture=::capture\n    }\n    fun sync() {\n        if(disposed)return\n        if(capturing&&!c.companion.panelOpen){captureJob?.cancel();captureJob=null;val active=selection;selection=null;capturing=false;active?.close()}\n        if(!c.floatingAssistantEnabled) {\n            dismissContextMenu()\n            if(c.companion.panelOpen)c.companion.close()\n            selection?.close();selection=null;captureJob?.cancel();capturing=false\n            ball.isVisible=false;quick?.isVisible=false;bubble.stop();return\n        }\n        ball.isVisible=!capturing\n        if(ball.isVisible)bubble.refresh()else bubble.stop()\n        if(c.companion.panelOpen&&!capturing) {\n            val panel=quick?:createQuick().also {quick=it}\n            panel.focusableWindowState=!c.companion.holdingToTalk\n            if(!panel.isVisible) {\n                val areas=desktopWorkAreas();val area=areas.firstOrNull {it.contains(ball.location)}?:areas.first()\n                panel.setSize(minOf(518,area.width),minOf(668,area.height))\n                val x=if(ball.x-panel.width-6>=area.x)ball.x-panel.width-6 else ball.x+ball.width+6\n                panel.location=clampFloatingBounds(Point(x,ball.y-panel.height/2+42),panel.width,panel.height,areas)\n                panel.isVisible=true\n                if(!c.companion.holdingToTalk){panel.toFront();panel.requestFocus()}\n            }\n        }else quick?.isVisible=false\n    }\n    private fun createQuick()=ComposeWindow().apply {\n        isUndecorated=true;isTransparent=true;isResizable=false;isAlwaysOnTop=true;type=Window.Type.UTILITY\n        title="Hermes · 随时问";iconImage=icon;defaultCloseOperation=WindowConstants.DO_NOTHING_ON_CLOSE\n        addWindowListener(object:WindowAdapter(){override fun windowClosing(e:WindowEvent){c.companion.close()}})\n        setContent {HermesTheme(c){FloatingQuickPanel(c)}}\n    }\n    private fun capture(session:HermesSession) {\n        if(capturing||disposed)return\n        capturing=true;dismissContextMenu();ball.isVisible=false;quick?.isVisible=false;bubble.stop()\n        val epoch=c.epoch\n        captureJob=c.scope.launch {\n            try {\n                delay(160) // Let the desktop repaint after removing our two surfaces.\n                val screens=withContext(Dispatchers.IO){captureDesktopScreens()}\n                ensureActive();if(disposed)return@launch\n                selection=ScreenSelection(screens){rectangle->\n                    selection=null\n                    if(rectangle==null){capturing=false;sync()}\n                    else captureJob=c.scope.launch {\n                        try {\n                            val bytes=withContext(Dispatchers.Default){composeScreenSelection(screens,rectangle)}\n                            if(epoch==c.epoch&&!disposed)c.companion.addCapture(session,bytes)\n                        }catch(e:CancellationException){throw e}catch(e:Exception){c.companion.report(e.message?:"截图失败，请重试。")}\n                        finally {capturing=false;sync()}\n                    }\n                }\n            }catch(e:CancellationException){throw e}catch(e:Exception){capturing=false;c.companion.report(e.message?:"无法截取屏幕，请检查系统权限。" );sync()}\n        }\n    }\n    override fun close(){if(disposed)return;disposed=true;contextMenu?.close();macContextMenu?.close();captureJob?.cancel();selection?.close();selection=null;bubble.stop();ball.dispose();quick?.dispose();quick=null;c.companion.capture=null}\n\n    private inner class BallPanel:FloatingBallSurface() {\n        private val gesture=FloatingGestures((Toolkit.getDefaultToolkit().getDesktopProperty("awt.multiClickInterval") as? Int?:300).toLong().coerceIn(180,500))\n        private var hover=false\n        private var dropping=false\n        private var pressed=false\n        private var contextPressed=false\n        private var dragging=false\n        private var down=Point()\n        private var origin=Point()\n        private var emphasis=0f\n        private var lastNanos=System.nanoTime()\n        private val timer=Timer(16){tick()}\n        init {\n            isOpaque=false\n            val listener=object:MouseAdapter() {\n                override fun mouseEntered(e:MouseEvent){updateHover(pointerInside()?:true)}\n                override fun mouseExited(e:MouseEvent){updateHover(pointerInside()?:false)}\n                override fun mousePressed(e:MouseEvent) {\n                    if(isFloatingContextClick(e)){gesture.cancel();c.companion.cancelHoldToTalk();pressed=false;contextPressed=true;return}\n                    if(!SwingUtilities.isLeftMouseButton(e))return\n                    pressed=true;dragging=false;down=e.locationOnScreen;origin=ball.location;gesture.press(down,e.`when`);refresh()\n                }\n                override fun mouseDragged(e:MouseEvent) {\n                    if(!pressed)return\n                    val point=e.locationOnScreen\n                    if(gesture.move(point)==FloatingGestures.Result.DRAG) {\n                        dragging=true;ball.location=clampFloatingBounds(Point(origin.x+point.x-down.x,origin.y+point.y-down.y),ball.width,ball.height,desktopWorkAreas())\n                    }\n                }\n                override fun mouseReleased(e:MouseEvent) {\n                    if(contextPressed||isFloatingContextClick(e)){contextPressed=false;menu(e);return}\n                    if(!SwingUtilities.isLeftMouseButton(e))return\n                    pressed=false;dispatch(gesture.release(e.locationOnScreen,e.`when`))\n                    if(dragging){c.savePreference("floatingX",ball.x.toString());c.savePreference("floatingY",ball.y.toString())}\n                    dragging=false;refresh()\n                }\n            }\n            addMouseListener(listener);addMouseMotionListener(listener)\n            dropTarget=DropTarget(this,DnDConstants.ACTION_COPY,object:DropTargetAdapter(){\n                override fun dragEnter(e:DropTargetDragEvent){if(hasFileTransfer(e.transferable)){e.acceptDrag(DnDConstants.ACTION_COPY);dropping=true;refresh()}else e.rejectDrag()}\n                override fun dragExit(e:DropTargetEvent){dropping=false;refresh()}\n                override fun drop(e:DropTargetDropEvent) {\n                    dropping=false;gesture.cancel();c.companion.cancelHoldToTalk()\n                    try {\n                        if(!hasFileTransfer(e.transferable)){e.rejectDrop();return}\n                        e.acceptDrop(DnDConstants.ACTION_COPY);val files=transferredFiles(e.transferable);e.dropComplete(files.isNotEmpty())\n                        if(files.isNotEmpty())SwingUtilities.invokeLater {c.companion.open(files=files);sync()}\n                    }catch(_:Exception){c.companion.open();c.companion.report("文件没有添加成功，请重新拖入。")}\n                    refresh()\n                }\n            })\n        }\n        private fun dispatch(action:FloatingGestures.Result) {\n            when(action){\n                FloatingGestures.Result.ASK->c.companion.open()\n                FloatingGestures.Result.CAPTURE->c.companion.open(CompanionAction.CAPTURE)\n                FloatingGestures.Result.VOICE->c.companion.beginHoldToTalk()\n                FloatingGestures.Result.VOICE_RELEASE->c.companion.releaseHoldToTalk()\n                else->return\n            }\n            sync()\n        }\n        // Use screen coordinates, not animated image alpha or synthetic native enter/exit.\n        private fun pointerInside():Boolean?=try {\n            MouseInfo.getPointerInfo()?.location?.let {ball.isVisible&&ball.bounds.contains(it)}\n        }catch(_:SecurityException){null}\n        private fun updateHover(value:Boolean){if(hover!=value){hover=value;refresh()}}\n        fun stop(){timer.stop();gesture.cancel();c.companion.cancelHoldToTalk();pressed=false;hover=false;dropping=false;emphasis=0f}\n        fun refresh(){timer.delay=16;if(!timer.isRunning){lastNanos=System.nanoTime();timer.start()};repaint()}\n        private fun tick() {\n            dispatch(gesture.tick(System.currentTimeMillis()))\n            if(!ball.isVisible){stop();return}\n            pointerInside()?.let {hover=it}\n            val now=System.nanoTime();val dt=((now-lastNanos)/1e9).coerceAtMost(.05);lastNanos=now\n            val target=if(hover||dropping||pressed)1f else 0f\n            emphasis=if(c.reduceMotion)target else (emphasis+(target-emphasis)*(1-exp(-dt*18))).toFloat()\n            repaint()\n            val settled=!gesture.waiting&&abs(emphasis-target)<.003&&(!c.voice.active||c.reduceMotion)\n            // Keep a cheap pointer check while hovered: some platforms omit the real exit\n            // after sending a synthetic exit over a translucent surface.\n            if(settled&&!hover)timer.stop()\n            timer.delay=if(settled&&hover)80 else 16\n        }\n        override fun paintComponent(graphics:Graphics) {\n            val g=graphics.create() as Graphics2D\n            try {\n                // Alpha zero is click-through on some native compositors. A constant nonzero\n                // backing keeps the whole 84px input surface stable throughout the animation.\n                g.color=Color(0,0,0,1);g.fillRect(0,0,width,height)\n                g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,RenderingHints.VALUE_ANTIALIAS_ON)\n                g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BICUBIC)\n                val pulse=if(c.voice.active&&!c.reduceMotion)((sin(System.nanoTime()/1e9*3)+1)/2).toFloat()else 0f\n                val size=(64+emphasis*3).toInt();val x=(width-size)/2;val y=(height-size)/2-(emphasis*2).toInt()\n                g.color=Color(35,59,107,25);g.fillRoundRect(x-1,y+4,size+2,size,22,22)\n                if(dropping||c.voice.active) {\n                    g.color=if(c.voice.phase==VoicePhase.ERROR)Color(202,65,72,100)else Color(58,115,248,(55+pulse*45).toInt())\n                    g.stroke=BasicStroke(2f+if(c.voice.active)c.voice.level*3f else 0f);g.drawRoundRect(x-4,y-4,size+8,size+8,26,26)\n                }\n                g.drawImage(icon,x,y,size,size,null)\n                if(c.voice.active){g.color=if(c.voice.phase==VoicePhase.LISTENING)Color(20,168,127)else Color(50,105,240);g.fillOval(x+size-11,y+size-11,11,11)}\n            }finally {g.dispose()}\n        }\n        private fun menu(e:MouseEvent) {\n            gesture.cancel();c.companion.cancelHoldToTalk();pressed=false\n            if(macContextMenu!=null)macContextMenu.show(bubble,e.locationOnScreen)else contextMenu?.show(e.locationOnScreen)\n        }\n    }\n}\n',encoding="utf-8")
          p=Path('src/main/kotlin/com/qingyu/hermescompanion/desktop/FloatingBallSurface.kt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('package com.qingyu.hermescompanion.desktop\n\nimport javax.swing.JPanel\n\n/** Shared with the native floating ball so initialization is testable without a display. */\ninternal open class FloatingBallSurface : JPanel() {\n    init {\n        // Call Swing\'s lazy initializer explicitly: the inherited protected field starts null.\n        // Keep this out of toolTipText: native tooltips can trigger hover flicker.\n        getAccessibleContext().accessibleDescription =\n            "单击提问 · 双击截图 · 按住说话，松开发送 · 拖动移动"\n    }\n}\n',encoding="utf-8")
          p=Path('src/test/kotlin/com/qingyu/hermescompanion/desktop/FloatingBallSurfaceTest.kt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('package com.qingyu.hermescompanion.desktop\n\nimport org.junit.Assert.*\nimport org.junit.Test\nimport javax.swing.SwingUtilities\n\nclass FloatingBallSurfaceTest {\n    @Test fun freshBallInitializesAccessibilityWithoutInstallingAHoverTooltip() {\n        SwingUtilities.invokeAndWait {\n            val panel = FloatingBallSurface()\n            assertEquals("单击提问 · 双击截图 · 按住说话，松开发送 · 拖动移动",\n                panel.getAccessibleContext().accessibleDescription)\n            assertNull(panel.toolTipText)\n            assertSame(panel.getAccessibleContext(), panel.getAccessibleContext())\n        }\n    }\n}\n',encoding="utf-8")
          p=Path('src/main/kotlin/com/qingyu/hermescompanion/R.kt'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('package com.qingyu.hermescompanion\nobject R { object string {\nconst val ui_0049=10000\nconst val ui_0050=10001\nconst val ui_0051 = 0\nconst val ui_0055 = 1\nconst val ui_0056 = 2\nconst val ui_0057 = 3\nconst val ui_0065 = 4\nconst val ui_0066 = 5\nconst val ui_0067 = 6\nconst val ui_0068 = 7\nconst val ui_0069 = 8\nconst val ui_0070 = 9\nconst val ui_0071 = 10\nconst val ui_0072 = 11\nconst val ui_0073 = 12\nconst val ui_0074 = 13\nconst val ui_0075 = 14\nconst val ui_0076 = 15\nconst val ui_0077 = 16\nconst val ui_0078 = 17\nconst val ui_0079 = 18\nconst val ui_0080 = 19\nconst val ui_0081 = 20\nconst val ui_0082 = 21\nconst val ui_0083 = 22\nconst val ui_0084 = 23\nconst val ui_0085 = 24\nconst val ui_0086 = 25\nconst val ui_0087 = 26\nconst val ui_0088 = 27\nconst val ui_0089 = 28\nconst val ui_0090 = 29\nconst val ui_0091 = 30\nconst val ui_0092 = 31\nconst val ui_0093 = 32\nconst val ui_0094 = 33\nconst val ui_0095 = 34\nconst val ui_0096 = 35\nconst val ui_0097 = 36\nconst val ui_0098 = 37\nconst val ui_0099 = 38\nconst val ui_0100 = 39\nconst val ui_0101 = 40\nconst val ui_0102 = 41\nconst val ui_0103 = 42\nconst val ui_0104 = 43\nconst val ui_0105 = 44\nconst val ui_0106 = 45\nconst val ui_0107 = 46\nconst val ui_0108 = 47\nconst val ui_0109 = 48\nconst val ui_0110 = 49\nconst val ui_0111 = 50\nconst val ui_0112 = 51\nconst val ui_0113 = 52\nconst val ui_0114 = 53\nconst val ui_0115 = 54\nconst val ui_0116 = 55\nconst val ui_0117 = 56\nconst val ui_0118 = 57\nconst val ui_0119 = 58\nconst val ui_0120 = 59\nconst val ui_0121 = 60\nconst val ui_0122 = 61\nconst val ui_0123 = 62\nconst val ui_0124 = 63\nconst val ui_0125 = 64\nconst val ui_0126 = 65\nconst val ui_0127 = 66\nconst val ui_0128 = 67\nconst val ui_0129 = 68\nconst val ui_0130 = 69\nconst val ui_0131 = 70\nconst val ui_0132 = 71\nconst val ui_0133 = 72\nconst val ui_0134 = 73\nconst val ui_0149 = 74\nconst val ui_0150 = 75\nconst val ui_0474 = 76\nconst val ui_0475 = 77\nconst val ui_0476 = 78\nconst val ui_0477 = 79\nconst val ui_0478 = 80\nconst val ui_0479 = 81\nconst val ui_0483 = 82\nconst val ui_0484 = 83\nconst val ui_0485 = 84\nconst val ui_0486 = 85\nconst val ui_0487 = 86\nconst val ui_0488 = 87\nconst val ui_0489 = 88\nconst val ui_0490 = 89\nconst val ui_0151 = 90\nconst val ui_0152 = 91\nconst val ui_0153 = 92\nconst val ui_0154 = 93\nconst val ui_0155 = 94\nconst val ui_0156 = 95\nconst val ui_0176 = 96\nconst val ui_0182 = 97\nconst val ui_0183 = 98\nconst val ui_0184 = 99\nconst val ui_0185 = 100\n} }\nobject BuildConfig { const val VERSION_NAME = "1.8.5" }\n',encoding="utf-8")
          p=Path('build.gradle.kts'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('import org.jetbrains.compose.desktop.application.dsl.TargetFormat\nplugins {\n    kotlin("jvm") version "2.3.20"\n    id("org.jetbrains.kotlin.plugin.compose") version "2.3.20"\n    id("org.jetbrains.compose") version "1.10.1"\n}\nrepositories { mavenCentral(); google() }\nkotlin { jvmToolchain(21) }\nval desktopTarget = providers.gradleProperty("desktopTarget").orNull\nval windowsTarget = desktopTarget == "windows-x64"\nval macArmTarget = desktopTarget == "macos-arm64"\ndependencies {\n    implementation(when {windowsTarget->"org.jetbrains.compose.desktop:desktop-jvm-windows-x64:1.10.1";macArmTarget->"org.jetbrains.compose.desktop:desktop-jvm-macos-arm64:1.10.1";else->compose.desktop.currentOs})\n    implementation(compose.material3)\n    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.10.2")\n    implementation("com.squareup.okhttp3:okhttp:4.12.0")\n    implementation("org.json:json:20240303")\n    implementation("com.ibm.icu:icu4j:76.1")\n    implementation("net.java.dev.jna:jna:5.17.0")\n    implementation("net.java.dev.jna:jna-platform:5.17.0")\n    implementation("org.commonmark:commonmark:0.24.0")\n    implementation("org.commonmark:commonmark-ext-gfm-tables:0.24.0")\n    implementation("org.apache.pdfbox:pdfbox:3.0.8")\n    implementation("org.apache.poi:poi-ooxml:5.5.1")\n    implementation("org.apache.poi:poi-scratchpad:5.5.1")\n    implementation("org.jsoup:jsoup:1.23.2")\n    implementation("org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0")\n    val fxPlatform = when {\n        macArmTarget -> "mac-aarch64"\n        windowsTarget || System.getProperty("os.name").startsWith("Windows") -> {\n            check(windowsTarget || System.getProperty("os.arch") in listOf("amd64", "x86_64")) { "Windows builds require an x64 JDK 21. Windows ARM64 and 32-bit Java are not supported by this release." }\n            "win"\n        }\n        System.getProperty("os.name").startsWith("Mac") -> if (System.getProperty("os.arch") == "aarch64") "mac-aarch64" else "mac"\n        else -> "linux"\n    }\n    // Each JavaFX module is explicit. Avoid Maven\'s host classifier pulling in a second platform.\n    listOf("base", "graphics", "controls", "media", "web", "swing").forEach { implementation("org.openjfx:javafx-$it:21.0.8:$fxPlatform") { isTransitive = false } }\n    testImplementation("junit:junit:4.13.2")\n    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")\n    testImplementation("org.mockito:mockito-core:5.14.2")\n}\ncompose.desktop {\n    application {\n        mainClass = "com.qingyu.hermescompanion.desktop.MainKt"\n        jvmArgs += listOf("-Dfile.encoding=UTF-8", "-Xmx1536m")\n        if (System.getProperty("os.name").startsWith("Mac")) jvmArgs += listOf("-Dapple.laf.useScreenMenuBar=true","-Dapple.awt.enableTemplateImages=true")\n        nativeDistributions {\n            targetFormats(TargetFormat.Dmg, TargetFormat.Exe, TargetFormat.Msi)\n            packageName = "Hermes"\n            packageVersion = "1.8.5"\n            vendor = "Jerome"\n            description = "Hermes desktop companion"\n            includeAllModules = true\n            appResourcesRootDir.set(project.layout.projectDirectory.dir("packaging/app-resources"))\n            windows {\n                iconFile.set(file("packaging/Hermes.ico"))\n                perUserInstall = true\n                dirChooser = true\n                menuGroup = "Hermes"\n                shortcut = true\n                menu = true\n                upgradeUuid = "b41c729f-72a4-4a43-a028-c7525e03f0de"\n            }\n            macOS {\n                if (file("packaging/Hermes.icns").exists()) iconFile.set(file("packaging/Hermes.icns"))\n                bundleID = "com.qingyu.hermes.desktop"\n                minimumSystemVersion = "13.0"\n                dockName = "Hermes"\n                infoPlist {\n                    extraKeysRawXml = "<key>HermesBuildRevision</key><string>accessibility-hotfix-1.8.5</string><key>NSMicrophoneUsageDescription</key><string>Hermes 使用麦克风进行语音输入和对话。</string><key>NSSpeechRecognitionUsageDescription</key><string>Hermes 将录音识别为对话文字。</string>"\n                }\n            }\n        }\n    }\n}\n\n// Portable distribution: jpackage app-image needs no WiX and bundles its own Java runtime.\ntasks.register<Zip>("packageWindowsPortable") {\n    dependsOn("createDistributable")\n    onlyIf { System.getProperty("os.name").startsWith("Windows") }\n    archiveFileName.set("Hermes-Windows-x64.zip")\n    destinationDirectory.set(layout.buildDirectory.dir("windows"))\n    from(layout.buildDirectory.dir("compose/binaries/main/app/Hermes")) { into("Hermes") }\n    doFirst {\n        check(layout.buildDirectory.file("compose/binaries/main/app/Hermes/Hermes.exe").get().asFile.isFile) { "Hermes.exe was not generated; the portable package was not created." }\n    }\n}\ntasks.test {\n    maxHeapSize = "1g"\n    // Cloud builds exercise offscreen Compose; desktop Robot tests need a local interactive session.\n    systemProperty("java.awt.headless", providers.gradleProperty("headlessTests").getOrElse("false"))\n}\n\n// Assemble JVM code with genuine Windows native libraries, without invoking cross-OS jpackage.\ntasks.register<Sync>("stageWindowsApplication") {\n    dependsOn(tasks.jar)\n    into(layout.buildDirectory.dir("windows-staging/app"))\n    from(tasks.jar) { rename { "hermes-desktop.jar" } }\n    from(configurations.runtimeClasspath)\n    doFirst {\n        check(windowsTarget || System.getProperty("os.name").startsWith("Windows")) { "Pass -PdesktopTarget=windows-x64 to stage Windows libraries." }\n        check(configurations.runtimeClasspath.get().files.none { it.name.contains("-linux") || it.name.contains("-macos") || it.name.contains("-mac-") }) { "A foreign platform library was found in the Windows classpath." }\n    }\n}\n\n// Platform-independent bytecode plus only Apple Silicon native libraries.\ntasks.register<Sync>("stageMacApplication") {\n    dependsOn(tasks.jar)\n    into(layout.buildDirectory.dir("macos-staging/app"))\n    from(tasks.jar) {rename {"hermes-desktop.jar"}}\n    from(configurations.runtimeClasspath)\n    doFirst {\n        check(macArmTarget) {"Pass -PdesktopTarget=macos-arm64 to stage Apple Silicon libraries."}\n        check(configurations.runtimeClasspath.get().files.none {it.name.contains("-linux")||it.name.contains("-win")||it.name.contains("-macos-x64")}) {"Foreign platform dependency in Apple Silicon staging."}\n    }\n}\n\ntasks.register<JavaExec>("renderPreviews") {\n    dependsOn(tasks.testClasses)\n    classpath = sourceSets.test.get().runtimeClasspath\n    mainClass.set("com.qingyu.hermescompanion.desktop.RenderPreviews")\n    systemProperty("java.awt.headless", "true")\n    systemProperty("skiko.renderApi", "SOFTWARE")\n}\n\ntasks.register<JavaExec>("render170Previews") {\n    dependsOn(tasks.testClasses)\n    classpath = sourceSets.test.get().runtimeClasspath\n    mainClass.set("com.qingyu.hermescompanion.desktop.Render170Previews")\n    systemProperty("java.awt.headless", "true")\n    systemProperty("skiko.renderApi", "SOFTWARE")\n}\n\n// Start Mockito with the test JVM; no runtime self-attach is required.\nval mockitoAgent by configurations.creating\ndependencies { mockitoAgent("org.mockito:mockito-core:5.14.2") { isTransitive = false } }\ntasks.test { doFirst { jvmArgs("-javaagent:${mockitoAgent.asPath}") } }\n\ntasks.register<JavaExec>("render180Previews") {\n    dependsOn(tasks.testClasses)\n    classpath = sourceSets.test.get().runtimeClasspath\n    mainClass.set("com.qingyu.hermescompanion.desktop.Render180Previews")\n    systemProperty("java.awt.headless", "true")\n    systemProperty("skiko.renderApi", "SOFTWARE")\n}\ntasks.register("writeVerificationClasspath") {\n    dependsOn(tasks.testClasses)\n    doLast {\n        layout.buildDirectory.file("verification180/classpath.txt").get().asFile.apply {\n            parentFile.mkdirs(); writeText(sourceSets.test.get().runtimeClasspath.asPath)\n        }\n    }\n}\n',encoding="utf-8")
      - name: Save repair and regression test
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix floating ball accessibility initialization crash in 1.8.5'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify regression catches original null access
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess
          p=Path('src/main/kotlin/com/qingyu/hermescompanion/desktop/FloatingBallSurface.kt')
          fixed=p.read_text(encoding='utf-8')
          gradle=['cmd','/c','gradlew.bat'] if os.name=='nt' else ['bash','gradlew']
          try:
              p.write_text(fixed.replace('getAccessibleContext().accessibleDescription','accessibleContext.accessibleDescription'),encoding='utf-8')
              result=subprocess.run(gradle+['test','--tests','*FloatingBallSurfaceTest','-PheadlessTests=true','--no-daemon','--console=plain'])
              report=Path('build/test-results/test/TEST-com.qingyu.hermescompanion.desktop.FloatingBallSurfaceTest.xml')
              assert result.returncode != 0 and report.exists(), 'Original bug must fail the regression test'
              content=report.read_text(encoding='utf-8')
              assert 'NullPointerException' in content and 'setAccessibleDescription' in content, 'Unexpected failure cause'
              Path('regression-original-failure.xml').write_text(content,encoding='utf-8')
          finally:
              p.write_text(fixed,encoding='utf-8')
      - name: Windows tests and installers
        if: runner.os == 'Windows'
        run: .\gradlew.bat test packageExe packageMsi packageWindowsPortable -PheadlessTests=true --no-daemon --console=plain
      - name: macOS ARM64 tests and DMG
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          chmod +x gradlew
          bash packaging/prepare-native.sh
          ./gradlew test packageDmg -PheadlessTests=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-1.8.5-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/windows/*.zip
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hermes-1.8.5-tests-${{ runner.os }}
          path: |
            build/reports/tests/
            build/test-results/test/*.xml
            regression-original-failure.xml
  release:
    needs: [source, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Hermes-1.8.5-*
      - name: Prepare versioned downloads
        shell: python
        run: |
          from pathlib import Path
          import shutil, hashlib, subprocess, zipfile
          out=Path('release-files');out.mkdir()
          patterns={'*.dmg':'Hermes-macOS-arm64-1.8.5.dmg','*.exe':'Hermes-Windows-x64-1.8.5-Setup.exe','*.msi':'Hermes-Windows-x64-1.8.5.msi','Hermes-Windows-x64.zip':'Hermes-Windows-x64-1.8.5-portable.zip'}
          for pattern,name in patterns.items():
              matches=list(Path('artifacts').rglob(pattern));assert len(matches)==1,(pattern,matches)
              shutil.copy2(matches[0],out/name)
          subprocess.run(['git','archive','--format=zip','--prefix=Hermes-Desktop-1.8.5-source/','-o',str(out/'Hermes-Desktop-1.8.5-source.zip'),'HEAD'],check=True)
          with zipfile.ZipFile(out/'Hermes-1.8.5-test-reports.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in Path('artifacts').glob('Hermes-1.8.5-tests-*'):
                  for p in folder.rglob('*'):
                      if p.is_file(): z.write(p,p.relative_to('artifacts'))
          (out/'Hermes-1.8.5-SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())),encoding='utf-8')
          Path('release-notes.md').write_text('修复 1.8.4 悬浮球初始化时的 AccessibleContext 空指针异常，保留悬浮球防闪烁处理。建议遇到启动或悬浮球报错的用户更新。\n\nWindows 和 macOS ARM64 均重新构建；回归检查先确认旧写法触发相同异常，再运行修复后的完整测试。详细结果见测试报告附件。\n\nWindows 使用 Setup.exe，Mac M 系列使用 DMG；另附 MSI、便携包、完整源码和 SHA-256 校验文件。安装包内置 Java。\n\n尚未完成用户真机安装及真实网关联调。未使用 Windows 商业代码签名或 Apple Developer ID 公证。',encoding="utf-8")
      - name: Create hotfix draft with validated binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create v1.8.5 release-files/* --draft --target '${{ needs.source.outputs.revision }}' --title 'Hermes Desktop 1.8.5 · 悬浮球启动修复' --notes-file release-notes.md
