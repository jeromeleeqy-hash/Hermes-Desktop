name: Repair atomic IME updates and build Hermes 1.8.8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-composer-1.8.8.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply atomic IME update repair
