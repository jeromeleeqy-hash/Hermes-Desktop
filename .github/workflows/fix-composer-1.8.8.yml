  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows tests and installers
        if: runner.os == 'Windows'
        run: .\gradlew.bat test packageExe packageMsi packageWindowsPortable -PheadlessTests=true --no-daemon --console=plain
      - name: Prove preedit clearing regression against previous event handling
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x gradlew
          guard=src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt
          cp "$guard" /tmp/ComposerIme.original
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt')
          p.write_text(p.read_text().replace('if (DesktopHost.isMac) InterceptPlatformTextInput', 'if (false) InterceptPlatformTextInput'))
          PYCODE
          set +e
          ./gradlew nativeImeTest --no-daemon --console=plain > /tmp/ime-baseline.log 2>&1
          baseline_exit=$?
          set -e
          cp /tmp/ComposerIme.original "$guard"
          cat /tmp/ime-baseline.log
          test "$baseline_exit" -ne 0
          grep -q 'Atomic IME update must not publish an empty intermediate draft' build/test-results/nativeImeTest/TEST-*.xml
          mkdir -p build/reports/ime-baseline
          cp build/test-results/nativeImeTest/TEST-*.xml build/reports/ime-baseline/
      - name: macOS ARM64 tests and DMG
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          chmod +x gradlew
          bash packaging/prepare-native.sh
          mkdir -p build
          clang -dynamiclib -fblocks -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/darwin" src/test/native/ImeCocoa.m -framework Cocoa -framework Carbon -o build/imeprobe.dylib
          ./gradlew test nativeImeTest systemImeTest packageDmg -PheadlessTests=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-1.8.8-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/windows/*.zip
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hermes-1.8.8-tests-${{ runner.os }}
          path: |
            build/reports/tests/
            build/reports/ime-baseline/
            build/test-results/test/*.xml
            build/test-results/nativeImeTest/*.xml
            build/test-results/systemImeTest/*.xml
            docs/validation/ime-1.8.8.md
  release:
    needs: [source, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Hermes-1.8.8-*
      - name: Prepare versioned downloads
        shell: python
        run: |
          from pathlib import Path
          import shutil, hashlib, subprocess, zipfile
          out=Path('release-files');out.mkdir()
          patterns={'*.dmg':'Hermes-macOS-arm64-1.8.8.dmg','*.exe':'Hermes-Windows-x64-1.8.8-Setup.exe','*.msi':'Hermes-Windows-x64-1.8.8.msi','Hermes-Windows-x64.zip':'Hermes-Windows-x64-1.8.8-portable.zip'}
          for pattern,name in patterns.items():
              matches=list(Path('artifacts').rglob(pattern));assert len(matches)==1,(pattern,matches)
              shutil.copy2(matches[0],out/name)
          subprocess.run(['git','archive','--format=zip','--prefix=Hermes-Desktop-1.8.8-source/','-o',str(out/'Hermes-Desktop-1.8.8-source.zip'),'HEAD'],check=True)
          with zipfile.ZipFile(out/'Hermes-1.8.8-test-reports.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in Path('artifacts').glob('Hermes-1.8.8-tests-*'):
                  for p in folder.rglob('*'):
                      if p.is_file(): z.write(p,p.relative_to('artifacts'))
          (out/'Hermes-1.8.8-SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())),encoding='utf-8')
          Path('release-notes.md').write_text('修复 Compose 1.10.1 把一次输入法更新拆为两次独立状态修改的问题，避免先清空拼音再恢复剩余内容。三个 Mac 输入框共享同一修正；保留已有的分隔线和悬浮球修复。\n\n新增原子更新回归、AWT 输入事件检查和真实系统拼音 Robot 测试；旧逻辑必须在中间清空检查中失败。微信输入法在全新 CI 会话中无法选择，不能把系统拼音通过当作微信输入法通过；用户本机结果待确认。\n\n帮助菜单新增输入法诊断，仅记录诊断窗口事件元数据，不记录输入文字，不自动上传。\n\n包含 Mac ARM64 DMG、Windows x64 安装包、源码及测试报告。',encoding='utf-8')
      - name: Create tested repair draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create v1.8.8 release-files/* --draft --target '${{ needs.source.outputs.revision }}' --title 'Hermes Desktop 1.8.8 · 输入法原子更新修复' --notes-file release-notes.md
