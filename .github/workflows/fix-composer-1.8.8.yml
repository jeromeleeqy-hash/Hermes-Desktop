        run: |
          import subprocess
          patch='diff --git a/build.gradle.kts b/build.gradle.kts\nindex a633519..4218005 100644\n--- a/build.gradle.kts\n+++ b/build.gradle.kts\n@@ -48,7 +48,7 @@ compose.desktop {\n         nativeDistributions {\n             targetFormats(TargetFormat.Dmg, TargetFormat.Exe, TargetFormat.Msi)\n             packageName = "Hermes"\n-            packageVersion = "1.8.7"\n+            packageVersion = "1.8.8"\n             vendor = "Jerome"\n             description = "Hermes desktop companion"\n             includeAllModules = true\n@@ -68,7 +68,7 @@ compose.desktop {\n                 minimumSystemVersion = "13.0"\n                 dockName = "Hermes"\n                 infoPlist {\n-                    extraKeysRawXml = "<key>HermesBuildRevision</key><string>ime-compat-1.8.7</string><key>NSMicrophoneUsageDescription</key><string>Hermes 使用麦克风进行语音输入和对话。</string><key>NSSpeechRecognitionUsageDescription</key><string>Hermes 将录音识别为对话文字。</string>"\n+                    extraKeysRawXml = "<key>HermesBuildRevision</key><string>ime-compat-1.8.8</string><key>NSMicrophoneUsageDescription</key><string>Hermes 使用麦克风进行语音输入和对话。</string><key>NSSpeechRecognitionUsageDescription</key><string>Hermes 将录音识别为对话文字。</string>"\n                 }\n             }\n         }\n@@ -168,3 +168,12 @@ tasks.register<Test>("nativeImeTest") {\n     systemProperty("java.awt.headless", "false")\n     maxHeapSize = "1g"\n }\n+\n+tasks.register<Test>("systemImeTest") {\n+    testClassesDirs = sourceSets.test.get().output.classesDirs\n+    classpath = sourceSets.test.get().runtimeClasspath\n+    filter { includeTestsMatching("*ComposerSystemImeTest") }\n+    systemProperty("java.awt.headless", "false")\n+    systemProperty("hermes.systemImeTest", "true")\n+    maxHeapSize = "1g"\n+}\ndiff --git a/docs/validation/ime-1.8.8.md b/docs/validation/ime-1.8.8.md\nnew file mode 100644\nindex 0000000..80c2bfb\n--- /dev/null\n+++ b/docs/validation/ime-1.8.8.md\n@@ -0,0 +1,18 @@\n+# IME update repair in 1.8.8\n+\n+Compose 1.10.1 converts one `TextEditingScope` block into individual `onEditCommand` calls in `LegacyPlatformTextInputServiceAdapter.skiko.kt`. A preedit update executes `CommitText("")` then `SetComposingText(remaining)`. The first callback exposes a cleared preedit and null composition to the application before the second callback restores it.\n+\n+The upstream implementation now collects commands and calls `onEditCommand(commands)` once. Hermes backports that batching through the public `InterceptPlatformTextInput` API, scoped to its three macOS composers. No framework classes or native libraries are replaced. The native input method continues to own deletion; no pinyin is reconstructed in app code.\n+\n+Upstream source examined:\n+- https://github.com/JetBrains/compose-multiplatform-core/blob/v1.10.1/compose/foundation/foundation/src/skikoMain/kotlin/androidx/compose/foundation/text/input/internal/LegacyPlatformTextInputServiceAdapter.skiko.kt\n+- https://github.com/JetBrains/compose-multiplatform-core/blob/568b08af72b029e2622dd47c727de50aa547a68b/compose/foundation/foundation/src/skikoMain/kotlin/androidx/compose/foundation/text/input/internal/LegacyPlatformTextInputServiceAdapter.skiko.kt\n+\n+Verification distinguishes three things:\n+1. Batch semantics: one observable state per native edit, partial commits, explicit cancellation and aborted edits.\n+2. AWT integration: real Compose window, transient states checked during every input-method event; disable only batching to prove the regression check fails against 1.8.7 behavior.\n+3. Actual macOS input: opt-in Robot -> system Pinyin -> Cocoa -> AWT tests. WeType is a separate test and is explicitly skipped if macOS cannot select it. A passed system Pinyin test does not mean WeType passed.\n+\n+The user reported that 1.8.6/1.8.7 did not fix whole-preedit deletion with WeType. CI macOS 15.7.9 has so far refused WeType selection with OSStatus -50 after verified WeType 2.2.3 installation. The batching defect is confirmed independently; equivalence to the user\'s exact failure remains unconfirmed until WeType can be exercised in a working session.\n+\n+The Help > Input method diagnostics window is opt-in. It retains at most 500 metadata events in memory, only from its own window. It records lengths, ranges, key codes for editing keys, runtime versions and timing; no typed text. Nothing is uploaded. Copying requires a button click; closing removes the listener and discards the buffer.\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/R.kt b/src/main/kotlin/com/qingyu/hermescompanion/R.kt\nindex 6a90300..d9a97ae 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/R.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/R.kt\n@@ -104,4 +104,4 @@ const val ui_0183 = 98\n const val ui_0184 = 99\n const val ui_0185 = 100\n } }\n-object BuildConfig { const val VERSION_NAME = "1.8.7" }\n+object BuildConfig { const val VERSION_NAME = "1.8.8" }\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt\nindex 4b1ab19..4d20823 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt\n@@ -62,6 +62,7 @@ import com.qingyu.hermescompanion.model.*\n             if(draft.startsWith("/")&&draft.length<30)c.commands.filter {it.command.contains(draft,true)}.take(4).forEach {command->\n                 DeskTextButton(onClick={c.setDraft(key,command.command+" ");focus.requestFocus()}){Text(command.command+"  "+command.description)}\n             }\n+            ComposerImeSession {\n             BasicTextField(field,{field=it;c.composerHasComposition=it.composition!=null;c.setDraft(key,it.text)},\n                 modifier=Modifier.fillMaxWidth().heightIn(min=56.dp,max=180.dp).focusRequester(focus).onFocusChanged {focused=it.isFocused}\n                     .preserveMacImeComposition {field}.onPreviewKeyEvent {e->when {\n@@ -73,6 +74,7 @@ import com.qingyu.hermescompanion.model.*\n                     .semantics {contentDescription=tr("消息输入框");testTag="chat-input"}.padding(6.dp),\n                 textStyle=MaterialTheme.typography.bodyMedium.copy(color=colors.onSurface,lineHeight=24.sp),cursorBrush=SolidColor(colors.primary),\n                 decorationBox={inner->Box {if(draft.isEmpty())Text(tr(if(run!=null)"任务进行中，可以继续补充…"else"写下想法，或添加资料…"),color=colors.onSurfaceVariant);inner()}})\n+        }\n             BoxWithConstraints {\n                 val narrow=maxWidth<610.dp\n                 Column(verticalArrangement=Arrangement.spacedBy(5.dp)) {\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt\nindex a5f5a2c..de75899 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt\n@@ -1,15 +1,53 @@\n+@file:OptIn(androidx.compose.ui.ExperimentalComposeUiApi::class)\n package com.qingyu.hermescompanion.desktop\n \n+import androidx.compose.runtime.Composable\n import androidx.compose.ui.Modifier\n import androidx.compose.ui.input.key.*\n-import androidx.compose.ui.text.input.TextFieldValue\n+import androidx.compose.ui.platform.InterceptPlatformTextInput\n+import androidx.compose.ui.platform.PlatformTextInputInterceptor\n+import androidx.compose.ui.platform.PlatformTextInputMethodRequest\n+import androidx.compose.ui.text.input.*\n import com.qingyu.hermescompanion.platform.DesktopHost\n \n-/** Native IME events have already reached AWT before Compose receives these keys.\n- * Do not let BasicTextField finish composing and delete the marked selection a\n- * second time when a macOS IME also forwards Backspace to the application.\n- * The IME remains responsible for editing its preedit string; never edit it here.\n+/** Compose 1.10.1\'s TextFieldValue adapter reports each edit in an IME update\n+ * separately. CommitText("") then SetComposingText exposes an empty editor and\n+ * null composition between two halves of a single native update. Keep that\n+ * update atomic, as in the upstream LegacyPlatformTextInputServiceAdapter fix.\n+ * Use the public input-session interceptor so no dependency classes are replaced.\n  */\n+internal fun atomicComposerImeRequest(request: PlatformTextInputMethodRequest): PlatformTextInputMethodRequest =\n+    object : PlatformTextInputMethodRequest by request {\n+        override val editText: (TextEditingScope.() -> Unit) -> Unit = { edit ->\n+            val commands = mutableListOf<EditCommand>()\n+            val scope = object : TextEditingScope {\n+                override fun deleteSurroundingTextInCodePoints(lengthBeforeCursor: Int, lengthAfterCursor: Int) {\n+                    commands += DeleteSurroundingTextInCodePointsCommand(lengthBeforeCursor, lengthAfterCursor)\n+                }\n+                override fun commitText(text: CharSequence, newCursorPosition: Int) {\n+                    commands += CommitTextCommand(text.toString(), newCursorPosition)\n+                }\n+                override fun setComposingText(text: CharSequence, newCursorPosition: Int) {\n+                    commands += SetComposingTextCommand(text.toString(), newCursorPosition)\n+                }\n+                override fun finishComposingText() { commands += FinishComposingTextCommand() }\n+            }\n+            scope.edit()\n+            if (commands.isNotEmpty()) request.onEditCommand(commands)\n+        }\n+    }\n+\n+private val ComposerImeInterceptor = PlatformTextInputInterceptor { request, next ->\n+    next.startInputMethod(atomicComposerImeRequest(request))\n+}\n+\n+@Composable\n+internal fun ComposerImeSession(content: @Composable () -> Unit) {\n+    if (DesktopHost.isMac) InterceptPlatformTextInput(ComposerImeInterceptor, content)\n+    else content()\n+}\n+\n+/** The native IME owns Backspace while composing. Never edit its preedit here. */\n internal fun Modifier.preserveMacImeComposition(value: () -> TextFieldValue): Modifier =\n     onPreviewKeyEvent { event ->\n         DesktopHost.isMac && value().composition != null &&\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerImeDiagnostics.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerImeDiagnostics.kt\nnew file mode 100644\nindex 0000000..ad27fc8\n--- /dev/null\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerImeDiagnostics.kt\n@@ -0,0 +1,88 @@\n+package com.qingyu.hermescompanion.desktop\n+\n+import androidx.compose.foundation.layout.*\n+import androidx.compose.foundation.text.BasicTextField\n+import androidx.compose.material3.*\n+import androidx.compose.runtime.*\n+import androidx.compose.ui.Modifier\n+import androidx.compose.ui.awt.ComposeWindow\n+import androidx.compose.ui.graphics.SolidColor\n+import androidx.compose.ui.text.input.TextFieldValue\n+import androidx.compose.ui.unit.dp\n+import com.qingyu.hermescompanion.BuildConfig\n+import java.awt.AWTEvent\n+import java.awt.Component\n+import java.awt.Toolkit\n+import java.awt.datatransfer.StringSelection\n+import java.awt.event.*\n+import java.util.concurrent.TimeUnit\n+import javax.swing.SwingUtilities\n+import javax.swing.WindowConstants\n+\n+private var imeDiagnosticWindow: ComposeWindow? = null\n+\n+/** Explicit, local diagnostic window. Record event metadata only, never typed text. */\n+internal fun showComposerImeDiagnostics(controller: DesktopController) {\n+    imeDiagnosticWindow?.let {it.toFront();return}\n+    val events=mutableStateListOf<String>()\n+    val started=System.nanoTime()\n+    fun record(message:String) {\n+        if(events.size>=500)events.removeAt(0)\n+        events += "${(System.nanoTime()-started)/1_000_000} ms $message"\n+    }\n+    val header="Hermes ${BuildConfig.VERSION_NAME}\\nOS ${System.getProperty("os.name")} ${System.getProperty("os.version")} ${System.getProperty("os.arch")}\\nJava ${System.getProperty("java.runtime.version")} ${System.getProperty("java.vendor")}\\nWeType ${weTypeVersion()}\\n"\n+    val window=ComposeWindow().apply {\n+        title="Hermes 输入法诊断";setSize(680,350);setLocationRelativeTo(null)\n+        defaultCloseOperation=WindowConstants.DISPOSE_ON_CLOSE\n+    }\n+    imeDiagnosticWindow=window\n+    val observer=AWTEventListener {event ->\n+        val component=event.source as? Component\n+        if(component!=null && SwingUtilities.getWindowAncestor(component)===window) {\n+            when(event) {\n+                is InputMethodEvent ->record("IME id=${event.id} length=${event.text?.let {it.endIndex-it.beginIndex}?:0} committed=${event.committedCharacterCount} caret=${event.caret?.insertionIndex}")\n+                is KeyEvent ->if(event.keyCode in setOf(KeyEvent.VK_BACK_SPACE,KeyEvent.VK_DELETE,KeyEvent.VK_ENTER,KeyEvent.VK_ESCAPE))\n+                    record("KEY id=${event.id} code=${event.keyCode} modifiers=${event.modifiersEx}")\n+                is FocusEvent ->record("FOCUS id=${event.id} temporary=${event.isTemporary}")\n+            }\n+        }\n+    }\n+    Toolkit.getDefaultToolkit().addAWTEventListener(observer,AWTEvent.INPUT_METHOD_EVENT_MASK or AWTEvent.KEY_EVENT_MASK or AWTEvent.FOCUS_EVENT_MASK)\n+    window.addWindowListener(object:WindowAdapter(){override fun windowClosed(event:WindowEvent){\n+        Toolkit.getDefaultToolkit().removeAWTEventListener(observer)\n+        if(imeDiagnosticWindow===window)imeDiagnosticWindow=null\n+        events.clear()\n+    }})\n+    window.setContent {\n+        HermesTheme(controller) {\n+            var value by remember {mutableStateOf(TextFieldValue())}\n+            var copied by remember {mutableStateOf(false)}\n+            Surface {\n+                Column(Modifier.fillMaxSize().padding(22.dp),verticalArrangement=Arrangement.spacedBy(14.dp)) {\n+                    Text("用微信输入法输入 nihaoshijie，不选词，按一次退格。",style=MaterialTheme.typography.titleMedium)\n+                    Text("只记录本窗口的事件顺序、文字长度和光标范围，不记录输入内容。",style=MaterialTheme.typography.bodySmall)\n+                    Surface(Modifier.weight(1f).fillMaxWidth(),shape=MaterialTheme.shapes.small,border=androidx.compose.foundation.BorderStroke(1.dp,MaterialTheme.colorScheme.outline)) {\n+                        ComposerImeSession {\n+                            BasicTextField(value,{next->value=next;record("VALUE length=${next.text.length} selection=${next.selection} composition=${next.composition}")},\n+                                Modifier.fillMaxSize().padding(12.dp).preserveMacImeComposition {value},\n+                                textStyle=MaterialTheme.typography.bodyLarge.copy(color=MaterialTheme.colorScheme.onSurface),cursorBrush=SolidColor(MaterialTheme.colorScheme.primary))\n+                        }\n+                    }\n+                    Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween) {\n+                        Text("已记录 ${events.size} 条事件",style=MaterialTheme.typography.bodySmall)\n+                        Button(onClick={Toolkit.getDefaultToolkit().systemClipboard.setContents(StringSelection(header+events.joinToString("\\n")),null);copied=true}) {\n+                            Text(if(copied)"已复制，可粘贴反馈"else"复制诊断结果")\n+                        }\n+                    }\n+                }\n+            }\n+        }\n+    }\n+    window.isVisible=true;window.toFront()\n+}\n+\n+private fun weTypeVersion():String = runCatching {\n+    val process=ProcessBuilder("/usr/libexec/PlistBuddy","-c","Print:CFBundleShortVersionString","/Library/Input Methods/WeType.app/Contents/Info.plist").redirectErrorStream(true).start()\n+    if(!process.waitFor(2,TimeUnit.SECONDS)){process.destroyForcibly();return@runCatching "unavailable"}\n+    if(process.exitValue()==0)process.inputStream.bufferedReader().use {it.readText().trim().take(80)} else "unavailable"\n+}.getOrDefault("unavailable")\ndiff --git a