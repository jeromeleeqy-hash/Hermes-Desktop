name: Fix composer and build Hermes 1.8.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-composer-1.8.6.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply composer and dark divider repair
        shell: python
        run: |
          import subprocess
          patch='diff --git a/build.gradle.kts b/build.gradle.kts\nindex f4a1dcc..30faea1 100644\n--- a/build.gradle.kts\n+++ b/build.gradle.kts\n@@ -48,7 +48,7 @@ compose.desktop {\n         nativeDistributions {\n             targetFormats(TargetFormat.Dmg, TargetFormat.Exe, TargetFormat.Msi)\n             packageName = "Hermes"\n-            packageVersion = "1.8.4"\n+            packageVersion = "1.8.6"\n             vendor = "Jerome"\n             description = "Hermes desktop companion"\n             includeAllModules = true\n@@ -68,7 +68,7 @@ compose.desktop {\n                 minimumSystemVersion = "13.0"\n                 dockName = "Hermes"\n                 infoPlist {\n-                    extraKeysRawXml = "<key>HermesBuildRevision</key><string>desktop-capabilities-1.8.4</string><key>NSMicrophoneUsageDescription</key><string>Hermes 使用麦克风进行语音输入和对话。</string><key>NSSpeechRecognitionUsageDescription</key><string>Hermes 将录音识别为对话文字。</string>"\n+                    extraKeysRawXml = "<key>HermesBuildRevision</key><string>composer-fix-1.8.6</string><key>NSMicrophoneUsageDescription</key><string>Hermes 使用麦克风进行语音输入和对话。</string><key>NSSpeechRecognitionUsageDescription</key><string>Hermes 将录音识别为对话文字。</string>"\n                 }\n             }\n         }\n@@ -152,3 +152,11 @@ tasks.register("writeVerificationClasspath") {\n         }\n     }\n }\n+\n+tasks.register<JavaExec>("renderComposer186") {\n+    dependsOn(tasks.testClasses)\n+    classpath = sourceSets.test.get().runtimeClasspath\n+    mainClass.set("com.qingyu.hermescompanion.desktop.RenderComposer186")\n+    systemProperty("java.awt.headless", "true")\n+    systemProperty("skiko.renderApi", "SOFTWARE")\n+}\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/R.kt b/src/main/kotlin/com/qingyu/hermescompanion/R.kt\nindex e265e0e..564e094 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/R.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/R.kt\n@@ -104,4 +104,4 @@ const val ui_0183 = 98\n const val ui_0184 = 99\n const val ui_0185 = 100\n } }\n-object BuildConfig { const val VERSION_NAME = "1.8.4" }\n+object BuildConfig { const val VERSION_NAME = "1.8.6" }\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt\nindex d95df6f..8c8b241 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ChatComposer.kt\n@@ -26,12 +26,11 @@ import com.qingyu.hermescompanion.model.*\n     val key=s.scopedId;val draft=c.drafts[key].orEmpty();val attached=c.attachments[key].orEmpty()\n     val run=c.runs[key];val preparing=(c.attachmentLoads[key]?:0)>0\n     val switching=c.modelSwitching[key]==true;val steering=c.steering[key]==true\n-    var field by remember(key){mutableStateOf(TextFieldValue(draft,TextRange(draft.length)))}\n+    var field by rememberComposerValue(key,draft)\n     var focused by remember(key){mutableStateOf(false)}\n     var fileHover by remember(key){mutableStateOf(false)}\n     var more by remember {mutableStateOf(false)}\n     val focus=remember(key){FocusRequester()}\n-    LaunchedEffect(draft){if(field.text!=draft)field=TextFieldValue(draft,TextRange(draft.length))}\n     DisposableEffect(key){onDispose {c.composerHasComposition=false}}\n     fun submit(){c.submitDraft()}\n     Column(Modifier.fillMaxWidth().padding(horizontal=20.dp,vertical=12.dp),verticalArrangement=Arrangement.spacedBy(8.dp)) {\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerValue.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerValue.kt\nnew file mode 100644\nindex 0000000..4b9ab01\n--- /dev/null\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerValue.kt\n@@ -0,0 +1,17 @@\n+package com.qingyu.hermescompanion.desktop\n+\n+import androidx.compose.runtime.*\n+import androidx.compose.ui.text.TextRange\n+import androidx.compose.ui.text.input.TextFieldValue\n+\n+/** Reconcile external edits before rendering, never from a delayed draft echo. */\n+@Composable\n+internal fun rememberComposerValue(key: String, draft: String): MutableState<TextFieldValue> {\n+    val field = remember(key) { mutableStateOf(TextFieldValue(draft, TextRange(draft.length))) }\n+    // Local edits update field and the controller together. Matching text must preserve\n+    // selection and IME composition; an external replacement is applied synchronously.\n+    if (field.value.text != draft) {\n+        field.value = TextFieldValue(draft, TextRange(draft.length))\n+    }\n+    return field\n+}\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopDashboard.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopDashboard.kt\nindex 48cb1b2..c47edb2 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopDashboard.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopDashboard.kt\n@@ -113,10 +113,9 @@ import java.time.format.DateTimeFormatter\n     val key=c.homeDraftKey();val draft=c.drafts[key].orEmpty();val attached=c.attachments[key].orEmpty()\n     val loading=(c.attachmentLoads[key]?:0)>0\n     val colors=MaterialTheme.colorScheme;val shape=LocalDesktopDesign.current.composerShape\n-    var field by remember(key){mutableStateOf(TextFieldValue(draft,TextRange(draft.length)))}\n+    var field by rememberComposerValue(key,draft)\n     var focused by remember{mutableStateOf(false)}\n     var fileHover by remember(key){mutableStateOf(false)}\n-    LaunchedEffect(draft){if(field.text!=draft)field=TextFieldValue(draft,TextRange(draft.length))}\n     Column(Modifier.fillMaxWidth().composerFileDrop(c,key){fileHover=it}.background(colors.surface,shape).border(if(focused||fileHover)1.5.dp else 1.dp,if(focused||fileHover)colors.primary.copy(alpha=.7f)else colors.outline,shape).padding(18.dp).semantics {testTag="home-composer"},verticalArrangement=Arrangement.spacedBy(14.dp)) {\n         BasicTextField(field,{field=it;c.setDraft(key,it.text)},modifier=Modifier.fillMaxWidth().heightIn(min=66.dp,max=180.dp).onFocusChanged {focused=it.isFocused}.onPreviewKeyEvent {e->\n             when {\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopFloatingHost.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopFloatingHost.kt\nindex 95b7059..d2c0c31 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopFloatingHost.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/DesktopFloatingHost.kt\n@@ -103,7 +103,7 @@ internal class DesktopFloatingHost(private val c:DesktopController):AutoCloseabl\n     }\n     override fun close(){if(disposed)return;disposed=true;contextMenu?.close();macContextMenu?.close();captureJob?.cancel();selection?.close();selection=null;bubble.stop();ball.dispose();quick?.dispose();quick=null;c.companion.capture=null}\n \n-    private inner class BallPanel:JPanel() {\n+    private inner class BallPanel:FloatingBallSurface() {\n         private val gesture=FloatingGestures((Toolkit.getDefaultToolkit().getDesktopProperty("awt.multiClickInterval") as? Int?:300).toLong().coerceIn(180,500))\n         private var hover=false\n         private var dropping=false\n@@ -117,8 +117,6 @@ internal class DesktopFloatingHost(private val c:DesktopController):AutoCloseabl\n         private val timer=Timer(16){tick()}\n         init {\n             isOpaque=false\n-            // A native tooltip can cover this unowned window and synthesize exit/enter events.\n-            accessibleContext.accessibleDescription="单击提问 · 双击截图 · 按住说话，松开发送 · 拖动移动"\n             val listener=object:MouseAdapter() {\n                 override fun mouseEntered(e:MouseEvent){updateHover(pointerInside()?:true)}\n                 override fun mouseExited(e:MouseEvent){updateHover(pointerInside()?:false)}\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/FloatingQuickPanel.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/FloatingQuickPanel.kt\nindex 0b9bf86..0075998 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/FloatingQuickPanel.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/FloatingQuickPanel.kt\n@@ -99,9 +99,8 @@ import com.qingyu.hermescompanion.model.scopedId\n @Composable private fun QuickComposer(c:DesktopController) {\n     val q=c.companion;val s=q.session?:return;val key=s.scopedId;val colors=MaterialTheme.colorScheme\n     val text=c.drafts[key].orEmpty();val files=c.attachments[key].orEmpty();val preparing=(c.attachmentLoads[key]?:0)>0\n-    var field by remember(key){mutableStateOf(TextFieldValue(text,TextRange(text.length)))}\n+    var field by rememberComposerValue(key,text)\n     var hover by remember {mutableStateOf(false)};val focus=remember {FocusRequester()}\n-    LaunchedEffect(text){if(field.text!=text)field=TextFieldValue(text,TextRange(text.length))}\n     LaunchedEffect(key,q.panelOpen){if(q.panelOpen)focus.requestFocus()}\n     Column(Modifier.fillMaxWidth().padding(12.dp).composerFileDrop(c,key){hover=it}.background(colors.surfaceVariant.copy(alpha=.45f),RoundedCornerShape(12.dp))\n         .border(1.dp,if(hover)colors.primary else colors.outline,RoundedCornerShape(12.dp)).padding(10.dp),verticalArrangement=Arrangement.spacedBy(7.dp)) {\ndiff --git a/src/main/kotlin/com/qingyu/hermescompanion/desktop/Main.kt b/src/main/kotlin/com/qingyu/hermescompanion/desktop/Main.kt\nindex b02e7eb..75cb4fd 100644\n--- a/src/main/kotlin/com/qingyu/hermescompanion/desktop/Main.kt\n+++ b/src/main/kotlin/com/qingyu/hermescompanion/desktop/Main.kt\n@@ -231,7 +231,7 @@ fun main(args:Array<String>) {\n                 }}\n             }\n             if(side) {\n-                Box(Modifier.width(5.dp).fillMaxHeight().background(colors.outline.copy(alpha=.35f))\n+                Box(Modifier.width(5.dp).fillMaxHeight()\n                     .semantics {testTag="files-divider"}.pointerHoverIcon(PointerIcon(java.awt.Cursor.getPredefinedCursor(java.awt.Cursor.E_RESIZE_CURSOR)))\n                     .pointerInput(panelLimit){detectHorizontalDragGestures(onDragEnd={c.savePreference("panelWidth",c.panelWidth.toString())}) {change,drag->change.consume();c.panelWidth=(c.panelWidth-drag/density).coerceIn(260f,panelLimit)}})\n                 Column(Modifier.width(width.dp).fillMaxHeight().desktopPanel()) {\ndiff --git a/src/test/kotlin/com/qingyu/hermescompanion/desktop/ComposerInputRegressionTest.kt b/src/test/kotlin/com/qingyu/hermescompanion/desktop/ComposerInputRegressionTest.kt\nnew file mode 100644\nindex 0000000..b218f5a\n--- /dev/null\n+++ b/src/test/kotlin/com/qingyu/hermescompanion/desktop/ComposerInputRegressionTest.kt\n@@ -0,0 +1,92 @@\n+@file:OptIn(androidx.compose.ui.ExperimentalComposeUiApi::class, androidx.compose.ui.InternalComposeUiApi::class)\n+package com.qingyu.hermescompanion.desktop\n+\n+import androidx.compose.foundation.layout.*\n+import androidx.compose.foundation.text.BasicTextField\n+import androidx.compose.runtime.*\n+import androidx.compose.ui.ImageComposeScene\n+import androidx.compose.ui.Modifier\n+import androidx.compose.ui.geometry.Offset\n+import androidx.compose.ui.input.key.*\n+import androidx.compose.ui.input.pointer.*\n+import androidx.compose.ui.semantics.*\n+import androidx.compose.ui.text.TextRange\n+import androidx.compose.ui.text.input.TextFieldValue\n+import androidx.compose.ui.unit.dp\n+import kotlinx.coroutines.*\n+import kotlinx.coroutines.swing.Swing\n+import org.junit.Assert.*\n+import org.junit.Test\n+\n+class ComposerInputRegressionTest {\n+    private class Editor {\n+        var key by mutableStateOf("a")\n+        var draft by mutableStateOf("abcdef中文XYZ")\n+        lateinit var field: MutableState<TextFieldValue>\n+        fun edit(value:TextFieldValue) { field.value=value;draft=value.text }\n+        @Composable fun Content() {\n+            field=rememberComposerValue(key,draft)\n+            BasicTextField(field.value,::edit,Modifier.width(500.dp).height(120.dp).semantics {testTag="editor"})\n+        }\n+    }\n+    private fun nodes(scene:ImageComposeScene):List<SemanticsNode> {\n+        fun walk(n:SemanticsNode):List<SemanticsNode> = listOf(n)+n.children.flatMap(::walk)\n+        return scene.semanticsOwners.flatMap {walk(it.unmergedRootSemanticsNode)}\n+    }\n+    private fun node(scene:ImageComposeScene)=nodes(scene).first {it.config.getOrNull(SemanticsProperties.TestTag)=="editor"}\n+    private suspend fun frames(scene:ImageComposeScene) {repeat(3){scene.render(System.nanoTime()).close();delay(15)}}\n+\n+    @Test fun pendingDraftEchoCannotOverwriteANewerDeletionOrSelection()=runBlocking<Unit>(Dispatchers.Swing) {\n+        val e=Editor();val scene=ImageComposeScene(600,200,coroutineContext=Dispatchers.Swing){e.Content()}\n+        try {\n+            frames(scene)\n+            repeat(20) {\n+                e.edit(TextFieldValue("abcdef中文XYZ",TextRange(8)))\n+                scene.render(System.nanoTime()).close()\n+                // Another input arrives before effects from the preceding frame can run.\n+                val latest=TextFieldValue("abcdef中XYZ",TextRange(7))\n+                e.edit(latest)\n+                yield();delay(10)\n+                assertEquals("A delayed draft echo rewrote the editor",latest,e.field.value)\n+                frames(scene)\n+                assertEquals(latest,e.field.value)\n+            }\n+        }finally {scene.close()}\n+    }\n+    @Test fun matchingDraftKeepsImeCompositionAndExternalReplacementAppliesBeforeRender()=runBlocking<Unit>(Dispatchers.Swing) {\n+        val e=Editor();val scene=ImageComposeScene(600,200,coroutineContext=Dispatchers.Swing){e.Content()}\n+        try {\n+            frames(scene)\n+            val composing=TextFieldValue("你好pinyin",TextRange(8),TextRange(2,8))\n+            e.edit(composing);frames(scene);assertEquals(composing,e.field.value)\n+            e.edit(composing.copy(selection=TextRange(3,6)));frames(scene)\n+            assertEquals(TextRange(3,6),e.field.value.selection)\n+            assertEquals(TextRange(2,8),e.field.value.composition)\n+            e.draft="外部插入的引用";scene.render(System.nanoTime()).close()\n+            assertEquals(e.draft,e.field.value.text);assertNull(e.field.value.composition)\n+            e.key="b";e.draft="另一个会话";frames(scene)\n+            assertEquals(e.draft,e.field.value.text)\n+            e.draft="";frames(scene);assertEquals(TextFieldValue(""),e.field.value)\n+        }finally {scene.close()}\n+    }\n+    @Test fun rapidBackspaceInTheMiddleDoesNotDeleteTheSuffix()=runBlocking<Unit>(Dispatchers.Swing) {\n+        val e=Editor();val scene=ImageComposeScene(600,200,coroutineContext=Dispatchers.Swing){e.Content()}\n+        try {\n+            frames(scene)\n+            val at=node(scene).boundsInRoot.center\n+            scene.sendPointerEvent(PointerEventType.Press,at,button=PointerButton.Primary)\n+            scene.sendPointerEvent(PointerEventType.Release,at,button=PointerButton.Primary)\n+            frames(scene)\n+            node(scene).config[SemanticsActions.SetSelection].action!!.invoke(8,8,false)\n+            frames(scene)\n+            repeat(5) { i->\n+                scene.sendKeyEvent(KeyEvent(Key.Backspace,KeyEventType.KeyDown))\n+                scene.sendKeyEvent(KeyEvent(Key.Backspace,KeyEventType.KeyUp))\n+                if(i%2==0)scene.render(System.nanoTime()).close()\n+            }\n+            frames(scene)\n+            assertEquals("abcXYZ",e.draft)\n+            assertEquals(TextRange(3),e.field.value.selection)\n+        }finally {scene.close()}\n+    }\n+}\ndiff --git a/src/test/kotlin/com/qingyu/hermescompanion/desktop/RenderComposer186.kt b/src/test/kotlin/com/qingyu/hermescompanion/desktop/RenderComposer186.kt\nnew file mode 100644\nindex 0000000..09dc12b\n--- /dev/null\n+++ b/src/test/kotlin/com/qingyu/hermescompanion/desktop/RenderComposer186.kt\n@@ -0,0 +1,24 @@\n+@file:OptIn(androidx.compose.ui.ExperimentalComposeUiApi::class, androidx.compose.ui.InternalComposeUiApi::class)\n+package com.qingyu.hermescompanion.desktop\n+import androidx.compose.ui.ImageComposeScene\n+import kotlinx.coroutines.*\n+import kotlinx.coroutines.swing.Swing\n+import java.io.File\n+object RenderComposer186 {\n+    @JvmStatic fun main(args:Array<String>) {\n+        try {runBlocking(Dispatchers.Swing) {\n+            val c=DesktopController(true);c.reduceMotion=true;c.appearance="深色";c.page=Page.CHAT;c.sidebarCollapsed=true;c.filesPanelOpen=true\n+            try {\n+                for(skin in listOf("轻盈办公","纸间留白","流光玻璃")) {\n+                    c.skin=skin\n+                    val scene=ImageComposeScene(1600,920,coroutineContext=Dispatchers.Swing){HermesTheme(c){DesktopBackdrop{DesktopWorkspace(c)}}}\n+                    try {\n+                        repeat(8){scene.render(System.nanoTime()).close();delay(25)}\n+                        val out=File("build/reports/visual-1.8.6/$skin.png");out.parentFile.mkdirs()\n+                        out.writeBytes(scene.render(System.nanoTime()).use {it.encodeToData()!!.use {data->data.bytes}})\n+                    }finally {scene.close()}\n+                }\n+            }finally {c.close()}\n+        };System.exit(0)}catch(e:Throwable){e.printStackTrace();System.exit(1)}\n+    }\n+}\n'
          check=subprocess.run(["git","apply","--check","-"],input=patch,text=True,capture_output=True)
          if check.returncode==0:
              subprocess.run(["git","apply","-"],input=patch,text=True,check=True)
          else:
              subprocess.run(["git","apply","--reverse","--check","-"],input=patch,text=True,check=True)
      - name: Save repair and regression test
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix composer draft synchronization and dark mode divider in 1.8.6'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows tests and installers
        if: runner.os == 'Windows'
        run: .\gradlew.bat test packageExe packageMsi packageWindowsPortable -PheadlessTests=true --no-daemon --console=plain
      - name: macOS ARM64 tests and DMG
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          chmod +x gradlew
          bash packaging/prepare-native.sh
          ./gradlew test renderComposer186 packageDmg -PheadlessTests=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-1.8.6-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/windows/*.zip
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hermes-1.8.6-tests-${{ runner.os }}
          path: |
            build/reports/tests/
            build/test-results/test/*.xml
            build/reports/visual-1.8.6/*.png
  release:
    needs: [source, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Hermes-1.8.6-*
      - name: Prepare versioned downloads
        shell: python
        run: |
          from pathlib import Path
          import shutil, hashlib, subprocess, zipfile
          out=Path('release-files');out.mkdir()
          patterns={'*.dmg':'Hermes-macOS-arm64-1.8.6.dmg','*.exe':'Hermes-Windows-x64-1.8.6-Setup.exe','*.msi':'Hermes-Windows-x64-1.8.6.msi','Hermes-Windows-x64.zip':'Hermes-Windows-x64-1.8.6-portable.zip'}
          for pattern,name in patterns.items():
              matches=list(Path('artifacts').rglob(pattern));assert len(matches)==1,(pattern,matches)
              shutil.copy2(matches[0],out/name)
          subprocess.run(['git','archive','--format=zip','--prefix=Hermes-Desktop-1.8.6-source/','-o',str(out/'Hermes-Desktop-1.8.6-source.zip'),'HEAD'],check=True)
          with zipfile.ZipFile(out/'Hermes-1.8.6-test-reports.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in Path('artifacts').glob('Hermes-1.8.6-tests-*'):
                  for p in folder.rglob('*'):
                      if p.is_file(): z.write(p,p.relative_to('artifacts'))
          (out/'Hermes-1.8.6-SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())),encoding='utf-8')
          Path('release-notes.md').write_text('修复主聊天、工作台和悬浮小窗输入框的草稿异步回写问题，避免快速编辑时旧草稿覆盖新输入或干扰光标位置。相同文字同步保留选区和中文输入法组合状态。\n\n移除深色模式文件侧栏拖拽分隔区域的额外色带，保留拖拽调宽能力。继续保留 1.8.5 悬浮球初始化修复，停用会回写旧版源码的历史导入任务。\n\n新增连续退格、中间删除、选区、输入法组合状态、外部插入和会话切换回归检查。两端完整测试和安装包构建结果见附件。\n\nWindows 使用 Setup.exe，Mac M 系列使用 DMG。含 MSI、便携包、完整源码、校验文件和测试报告。用户本机中文输入法实测仍需确认，未使用商业代码签名或 Apple Developer ID 公证。',encoding="utf-8")
      - name: Create tested repair draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create v1.8.6 release-files/* --draft --target '${{ needs.source.outputs.revision }}' --title 'Hermes Desktop 1.8.6 · 输入框与深色模式修复' --notes-file release-notes.md
