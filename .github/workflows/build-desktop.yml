name: Build current desktop source (Windows and macOS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat test --no-daemon --console=plain
      - name: Build Windows portable app with bundled runtime
        if: runner.os == 'Windows'
        run: .\gradlew.bat packageWindowsPortable --no-daemon --console=plain
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: .\gradlew.bat packageExe packageMsi --no-daemon --console=plain
      - name: Build and test on macOS
        if: runner.os == 'macOS'
        run: |
          chmod +x gradlew
          bash packaging/prepare-native.sh
          ./gradlew test packageDmg --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hermes-1.8.4-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/reports/tests/
            build/windows/*.zip
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn
