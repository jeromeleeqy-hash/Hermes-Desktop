name: Build Hermes 1.9.0 with in-app GitHub updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-updater-1.9.0.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply in-app updater source and regression tests
        shell: python
        run: |
          import subprocess
          patch_b64=''
          import base64
          patch=base64.b64decode(patch_b64).decode()
          check=subprocess.run(["git","apply","--check","-"],input=patch,text=True,capture_output=True)
          if check.returncode==0:
              subprocess.run(["git","apply","-"],input=patch,text=True,check=True)
          else:
              subprocess.run(["git","apply","--reverse","--check","-"],input=patch,text=True,check=True)
      - name: Save updater and regression test
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle.kts docs/RELEASE-1.9.0.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified in-app updater in 1.9.0'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows tests and installers
        if: runner.os == 'Windows'
        run: .\gradlew.bat test packageExe packageMsi packageWindowsPortable -PheadlessTests=true --no-daemon --console=plain
      - name: Prove preedit clearing regression against previous event handling
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x gradlew
          guard=src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt
          cp "$guard" /tmp/ComposerIme.original
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('src/main/kotlin/com/qingyu/hermescompanion/desktop/ComposerIme.kt')
          p.write_text(p.read_text().replace('if (DesktopHost.isMac) InterceptPlatformTextInput', 'if (false) InterceptPlatformTextInput'))
          PYCODE
          set +e
          ./gradlew nativeImeTest --no-daemon --console=plain > /tmp/ime-baseline.log 2>&1
          baseline_exit=$?
          set -e
          cp /tmp/ComposerIme.original "$guard"
          cat /tmp/ime-baseline.log
          test "$baseline_exit" -ne 0
          grep -q 'Atomic IME update must not publish an empty intermediate draft' build/test-results/nativeImeTest/TEST-*.xml
          mkdir -p build/reports/ime-baseline
          cp build/test-results/nativeImeTest/TEST-*.xml build/reports/ime-baseline/
      - name: macOS ARM64 tests and DMG
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          chmod +x gradlew
          bash packaging/prepare-native.sh
          mkdir -p build
          clang -dynamiclib -fblocks -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/darwin" src/test/native/ImeCocoa.m -framework Cocoa -framework Carbon -o build/imeprobe.dylib
          ./gradlew test nativeImeTest systemImeTest packageDmg -PheadlessTests=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-1.9.0-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/windows/*.zip
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hermes-1.9.0-tests-${{ runner.os }}
          path: |
            build/reports/tests/
            build/reports/ime-baseline/
            build/test-results/test/*.xml
            build/test-results/nativeImeTest/*.xml
            build/test-results/systemImeTest/*.xml
            docs/RELEASE-1.9.0.md
  release:
    needs: [source, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Hermes-1.9.0-*
      - name: Prepare versioned downloads
        shell: python
        run: |
          from pathlib import Path
          import shutil, hashlib, subprocess, zipfile
          out=Path('release-files');out.mkdir()
          patterns={'*.dmg':'Hermes-macOS-arm64-1.9.0.dmg','*.exe':'Hermes-Windows-x64-1.9.0-Setup.exe','*.msi':'Hermes-Windows-x64-1.9.0.msi','Hermes-Windows-x64.zip':'Hermes-Windows-x64-1.9.0-portable.zip'}
          for pattern,name in patterns.items():
              matches=list(Path('artifacts').rglob(pattern));assert len(matches)==1,(pattern,matches)
              shutil.copy2(matches[0],out/name)
          subprocess.run(['git','archive','--format=zip','--prefix=Hermes-Desktop-1.9.0-source/','-o',str(out/'Hermes-Desktop-1.9.0-source.zip'),'HEAD'],check=True)
          with zipfile.ZipFile(out/'Hermes-1.9.0-test-reports.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in Path('artifacts').glob('Hermes-1.9.0-tests-*'):
                  for p in folder.rglob('*'):
                      if p.is_file(): z.write(p,p.relative_to('artifacts'))
          (out/'Hermes-1.9.0-SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir())),encoding='utf-8')
          Path('release-notes.md').write_text('新增软件内更新：Hermes 会检查 GitHub 正式 Release，后台下载并校验对应平台安装包；用户确认后保存草稿、退出并自动完成安装。更新器限制为官方仓库和 SHA-256 匹配的 DMG/MSI，失败时保留旧版本。\\n\\n同时保留此前的输入法原子更新、深色模式分隔线、悬浮球和模型思考深度修复。包含 Mac ARM64 DMG、Windows x64 安装包、源码及测试报告。',encoding='utf-8')
      - name: Create tested updater draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create v1.9.0 release-files/* --draft --target '${{ needs.source.outputs.revision }}' --title 'Hermes Desktop 1.9.0 · 软件内更新' --notes-file release-notes.md
